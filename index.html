<style>
/* Layout: cabeçalho amarelo manteiga, conteúdo em lista de cartões, navegação fixa embaixo. Paleta suave derivada do KV do festival. */
:root{
  --nms1:#FEFAD9;--nms2:#FEFAD9;--nms3:#FEFAD9;--nms4:#1A1420;--nms5:#FEFAD9;--nms6:#1A1420;--nms7:#1A1420;--nms8:#FEFAD9;--nms9:#1A1420;--nms10:#FEFAD9;--nms11:#FEFAD9;--nms12:#1A1420;--nms13:#1A1420;--nms14:#FEFAD9;--nms15:#FEFAD9;--nms16:#FEFAD9;
  --bg:#FEFAD9; --paper:#FFFDF8; --butter:#FFD653; --rose:#EBA9CC; --sky:#884AFE; --sage:#A9D3A0;
  --lav:#884AFE; --peach:#F3C7A6; --ink:#3A3340; --ink2:#6E6578; --line:#E6DAC2;
  --warn:#F2B8A2; --warn-ink:#7A3B2A; --hdr:#FFD653; --on:#FFF6D9; --dk:#3A3340; --nm1:#2B1466;--nm2:#2B1466;--nm3:#2B1466;--nm4:#FEFAD9;--nm5:#2B1466;--nm6:#FEFAD9;--nm7:#FEFAD9;--nm8:#2B1466;--nm9:#FEFAD9;--nm10:#2B1466;--nm11:#2B1466;--nm12:#FEFAD9;--nm13:#FEFAD9;--nm14:#2B1466;--nm15:#2B1466;--nm16:#2B1466;--st1:#EB4B94;--st2:#FFD653;--st3:#92FE71;--st4:#884AFE;--st5:#FE5A5E;--st6:#301A5E;--st7:#497F38;--st8:#C3A4FE;--st9:#7F2D2F;--st10:#B2963A;--st11:#FEACAE;--st12:#82348D;--st13:#B23F42;--st14:#66B24F;--st15:#9071D1;--st16:#E8833A;
  --f-display:'Amatic SC','Comic Sans MS',cursive; --f-body:'Amatic SC','Comic Sans MS',cursive;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html,body{background:var(--hdr)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
#app{display:flex;flex-direction:column;position:fixed;top:0;bottom:0;left:0;right:0;max-width:720px;margin:0 auto;background:var(--bg)}
header{background:var(--butter);padding:10px 12px 10px 12px;border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:8px;position:relative;z-index:6}
header img.sticker{width:clamp(138px,40vw,156px);height:auto;flex:none;transform:rotate(-3deg);margin:2px 0 -10px 0;filter:drop-shadow(0 2px 0 rgba(58,51,64,.30)) drop-shadow(0 7px 8px rgba(58,51,64,.28))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header .t{flex:1;min-width:0}
header .dev{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;padding:2px 2px 0}
header .dev span{font-size:5.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--ink2);white-space:nowrap}
header .dev img{width:64px;height:auto;display:block}
#about-btn{width:40px;height:40px;flex:none;display:inline-flex;align-items:center;justify-content:center;padding:0}
header h1{font-family:var(--f-display);font-size:22px;line-height:1.1;margin:0;font-weight:700}
header p{margin:0;font-size:13px;color:var(--ink2)}
#about-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-weight:800}
main{flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 16px 24px;-webkit-overflow-scrolling:touch}
nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(54px,auto);background:var(--paper);border-top:2px solid var(--ink);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;color:var(--ink2);position:relative;min-height:56px}
nav button svg{width:24px;height:24px}
nav button[aria-selected="true"]{color:var(--ink);background:var(--butter)}
nav .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--rose);color:var(--ink);border:2px solid var(--ink);border-radius:10px;font-size:11px;min-width:20px;padding:0 4px;line-height:16px}
.row{display:flex;gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip-btn{flex:none;border:2px solid var(--ink);background:var(--paper);border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;min-height:38px;white-space:nowrap}
.chip-btn[aria-pressed="true"]{background:var(--rose)}
.rotdays .chip-btn{min-height:38px;padding:4px 6px;font-size:18px;border-radius:12px}
.rotdays{margin:2px 0 6px}
.days{margin-bottom:10px}.days .chip-btn{flex:1;text-align:center;border-radius:14px;padding:8px 6px;line-height:1.15}
.days .chip-btn b{display:block;font-family:var(--f-display);font-size:17px}
.days .chip-btn small{font-weight:600;color:var(--ink2)}
.days .chip-btn[aria-pressed="true"]{background:var(--sky)}
.days .chip-btn[aria-pressed="true"] small{color:var(--ink)}
.search{width:100%;border:2px solid var(--ink);border-radius:14px;padding:10px 14px;background:var(--paper);font:inherit;margin:0 0 8px;min-height:44px}
.hour{font-family:var(--f-display);font-weight:600;font-size:14px;color:var(--ink2);margin:14px 0 6px;display:flex;align-items:center;gap:8px}
.hour::after{content:"";flex:1;border-top:2px dashed var(--line)}
.card{display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:center;background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:10px 10px 10px 0;margin-bottom:8px;border-left:10px solid var(--c,var(--rose));padding-left:10px;position:relative}
.card.on{background:#FFF6D9}
.card .time{font-family:var(--f-display);font-weight:600;font-size:17px;line-height:1.1}
.card .time small{display:block;font-size:13px;color:var(--ink2);font-weight:500}
.card h3{margin:0;font-size:17px;line-height:1.2;font-weight:800;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:4px;align-items:center}
.st{display:inline-block;background:var(--c,var(--rose));border:1.5px solid var(--ink);border-radius:999px;padding:0 9px;font-size:12px;font-weight:800;line-height:20px}
.tag{font-size:12px;font-weight:700;color:var(--ink2)}
.live{background:var(--sage);border:1.5px solid var(--ink);border-radius:999px;padding:0 8px;font-size:12px;font-weight:800;line-height:20px}
.warn{background:var(--warn);color:var(--warn-ink);border:1.5px solid var(--warn-ink);border-radius:8px;padding:2px 8px;font-size:12.5px;font-weight:700;margin-top:6px}
.note{font-size:12.5px;color:var(--ink2);margin-top:4px}
.acts{display:flex;flex-direction:column;gap:6px;align-items:stretch}
.go{border:2px solid var(--ink);background:var(--paper);border-radius:12px;padding:6px 10px;font-weight:800;font-size:14px;min-height:40px;white-space:nowrap}
.go[aria-pressed="true"]{background:var(--sage)}
.mini{border:0;background:none;text-decoration:underline;font-size:12.5px;font-weight:700;color:var(--ink2);padding:2px;min-height:28px}
.empty{padding:28px 8px;text-align:center;color:var(--ink2);white-space:nowrap;font-size:clamp(12px,4.8vw,22px)}
.empty b{display:block;font-family:var(--f-display);font-size:19px;color:var(--ink);margin-bottom:4px}
h2.sec{font-family:var(--f-display);font-size:20px;margin:16px 0 8px}
h2.rotsec{display:flex;align-items:center;justify-content:space-between;gap:10px}
.totop{flex:none;border:0;background:none;padding:4px 6px;margin:0;color:var(--ink2);opacity:.6;font-family:inherit;font-size:16px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.totop:active{opacity:1}
.gap{font-size:13px;color:var(--ink2);padding:2px 0 8px 14px;border-left:3px dotted var(--line);margin-left:6px}
.gap.tight{color:var(--warn-ink);font-weight:700}
.btnp{border:2px solid var(--ink);background:var(--rose);border-radius:12px;padding:10px 16px;font-weight:800;min-height:44px}
.btns{border:2px solid var(--ink);background:var(--paper);border-radius:12px;padding:10px 16px;font-weight:800;min-height:44px}
/* mapa */
.mapbar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.zoom{display:flex;gap:6px}
.zoom button{width:44px;height:44px;border-radius:12px;border:2px solid var(--ink);background:var(--paper);font-size:22px;font-weight:800;line-height:1}
#mapwrap{border:2px solid var(--ink);border-radius:16px;overflow:auto;max-height:min(44vh,320px);background:#FEFAD9;-webkit-overflow-scrolling:touch}
#mapbox{position:relative;width:100%}
#mapbox img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none;filter:saturate(.55) brightness(1.06) contrast(.92)}
#mapbox.orig img{filter:none}
.pin{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-size:11.5px;font-weight:800;display:grid;place-items:center;padding:0;line-height:1;font-family:var(--f-body)}
.pin.palco{background:var(--rose)}.pin.exp{background:var(--butter)}.pin.beb{background:var(--sky)}.pin.ban{background:var(--lav)}.pin.sau{background:var(--sage)}.pin.pcd{background:var(--peach)}.pin.srv{background:var(--paper)}.pin.sai{background:var(--warn)}
.pin.dim{opacity:.18;pointer-events:none}
.pin.act{outline:4px solid var(--ink);z-index:5}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.lg{display:flex;gap:8px;align-items:center;border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:6px 8px;text-align:left;font-size:13.5px;font-weight:700;min-height:44px}
.lg i{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:800}
.lg span{min-width:0}
@media (max-width:360px){.legend{grid-template-columns:1fr}}
/* tempo */
.wcard{background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:14px;margin-bottom:12px}
.whead{display:flex;gap:12px;align-items:center}
.whead svg{width:56px;height:56px;flex:none}
.whead h3{margin:0;font-family:var(--f-display);font-size:19px}
.big{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.pill{display:inline-block;border:1.5px solid var(--ink);border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:800;margin-top:6px}
.wcard p{margin:10px 0 0}
.src{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
.src td,.src th{border-top:1.5px solid var(--line);padding:5px 4px;text-align:left;vertical-align:top}
.src th{font-weight:700;color:var(--ink2);width:34%}
.tips{margin:10px 0 0;padding-left:20px}
.tips li{margin:2px 0}
.alert{background:var(--warn);color:var(--warn-ink);border:1.5px solid var(--warn-ink);border-radius:10px;padding:6px 10px;font-weight:700;font-size:13.5px;margin-top:10px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.links a{border:2px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:800;color:var(--ink);background:var(--paper);text-decoration:none;min-height:40px;display:inline-flex;align-items:center}

.hrs{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 8px;margin-top:10px;scrollbar-width:thin}
.hc{flex:none;width:52px;text-align:center;font-size:12px;font-weight:700;border-radius:10px;padding:4px 0 5px;border:1.5px solid transparent}
.hc.now{border-color:var(--ink);background:var(--butter)}
.hc .h{color:var(--ink2)}
.hc .bar{height:54px;display:flex;align-items:flex-end;justify-content:center;margin:3px 0}
.hc .bar i{display:block;width:22px;border-radius:6px 6px 2px 2px;background:var(--sky);border:1.5px solid var(--ink);min-height:3px}
.hc .tp{font-family:var(--f-display);font-size:14px}
.hc .mm{color:var(--ink2);font-weight:700;font-size:10.5px;min-height:14px;white-space:nowrap}
.dry{background:var(--sage);border:1.5px solid var(--ink);border-radius:10px;padding:6px 10px;font-weight:700;font-size:13.5px;margin-top:10px}
details.oth{background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:10px 12px;margin-bottom:12px}
details.oth summary{font-weight:800;min-height:36px;display:flex;align-items:center;cursor:pointer}
.refresh{margin:0 0 12px}
:root[data-theme="dark"]{--bg:#1D1A23;--paper:#2A2631;--ink:#EEE8F3;--ink2:#B4ABC0;--line:#413B4B;--hdr:#2D2836;--on:#3A3426;color-scheme:dark}
:root[data-theme="dark"] #mapbox:not(.orig) img{filter:saturate(.5) brightness(.8) contrast(.95)}
:root[data-theme="dark"] .search::placeholder{color:#8F869B}
.search,select{color:var(--ink)}
header{background:var(--hdr);padding-top:calc(10px + env(safe-area-inset-top))}
nav button[aria-selected="true"]{background:var(--hdr)}
.card.on{background:var(--on)}
.hc.now{background:var(--on)}
.chip-btn[aria-pressed="true"],.go[aria-pressed="true"],.st,.live,.pill,.dry,.btnp,nav .badge,.days .chip-btn[aria-pressed="true"] small{color:var(--dk)}
.pin{color:var(--dk)}.pin.srv{background:#FEFAD9}
.whead svg{color:var(--ink)}
#theme-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;flex:none;padding:0}
#theme-btn svg{width:20px;height:20px}
#install{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--paper);border-bottom:1.5px solid var(--line);font-size:13.5px;font-weight:700;position:relative;z-index:5}
#install[hidden]{display:none}
#install .btnp{min-height:38px;padding:6px 14px;flex:none}
.plabel{position:absolute;left:0;top:0;z-index:5;max-width:150px;font-size:11.5px;line-height:1.2;font-weight:800;text-align:center;background:rgba(255,253,248,.93);color:var(--dk);border:1px solid rgba(58,51,64,.55);border-radius:6px;padding:1px 4px;box-shadow:0 1px 2px rgba(58,51,64,.25);visibility:hidden}
.plabel.dim{opacity:.18;pointer-events:none}
.plabel.show{visibility:visible}
.irl{color:#2A5BA8;text-decoration:underline;cursor:pointer;padding:6px 4px;margin:-6px -2px -6px 2px;display:inline-block}
#sheet-unused{display:none}
.pin{z-index:4}
#sheet .how{padding-left:18px;margin:6px 0}
#sheet .how li{margin:7px 0;line-height:1.35}
.chips .chip-btn[aria-pressed="true"]{background:var(--c,var(--rose))}
.chips .chip-btn[data-stage]:not([data-stage="all"])::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);border:1.5px solid var(--ink);margin-right:7px;vertical-align:-1px}
.chips .chip-btn[data-stage][aria-pressed="true"]{color:var(--dk)}
.chips .chip-btn[data-stage][aria-pressed="true"]::before{border-color:var(--dk)}
.shead{display:flex;align-items:flex-start;gap:10px}
.shead h2{margin:0 0 4px;flex:1 1 auto;min-width:0}
.shead .btnp{flex:none;min-height:40px;padding:6px 12px}
.shead .xbtn{float:none;flex:none}
.chips .chip-btn.nodata[aria-pressed="false"]{opacity:.5}
.chips .chip-btn[data-stage]:not([data-stage="all"])[aria-pressed="true"]::after{content:"×";margin-left:8px;font-size:17px;line-height:1;font-weight:800}
/* sheets */
#scrim{position:fixed;inset:0;background:rgba(58,51,64,.45);display:none;z-index:20}
#scrim.open{display:block}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:var(--paper);border:2px solid var(--ink);border-bottom:0;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));z-index:21;transform:translateY(105%);transition:transform .2s;max-height:82%;overflow:auto}
#sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
#sheet.full{top:0;height:100%;max-height:none;max-width:none;border:0;border-radius:0;padding-top:max(16px,env(safe-area-inset-top))}
#sheet h2{font-family:var(--f-display);font-size:21px;margin:0 0 6px}
#sheet p{margin:6px 0}
#sheet .acts2{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
#sheet ul{padding-left:20px;margin:8px 0}
#sheet textarea{width:100%;height:180px;border:2px solid var(--ink);border-radius:12px;padding:8px;font:inherit;font-size:14px;background:var(--bg)}
.xbtn{float:right;width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);font-weight:800}

/* ================= Tema RTM: cores e caixas do festival ================= */
@font-face{font-family:'Amatic SC';src:url('fonts/AmaticSC-Regular.woff') format('woff');font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Amatic SC';src:url('fonts/AmaticSC-Bold.woff') format('woff');font-weight:700 900;font-style:normal;font-display:swap}
:root{
 --bg:#FEFAD9;--paper:#FEFAD9;--ink:#1A1420;--ink2:#5A4B63;--line:#E3D6A8;
 --butter:#FFD653;--rose:#EB4B94;--sky:#884AFE;--sage:#92FE71;--lav:#884AFE;--peach:#FE5A5E;--blue:#884AFE;--coral:#FE5A5E;
 --hdr:#FEFAD9;--on:#FFD653;--dk:#1A1420;--warn:#FE5A5E;--warn-ink:#1A1420;
 --bd:#1A1420;--sh:#1A1420;--csh:#1A1420;--deep:#6034BD;
 --st1:#EB4B94;--st2:#FFD653;--st3:#92FE71;--st4:#884AFE;--st5:#FE5A5E;--st6:#301A5E;--st7:#497F38;--st8:#C3A4FE;--st9:#7F2D2F;--st10:#B2963A;--st11:#FEACAE;--st12:#82348D;--st13:#B23F42;--st14:#66B24F;--st15:#9071D1;
 --rx:12px 9px 13px 8px/9px 13px 8px 12px;
}
:root[data-theme="dark"]{
 --bg:#141214;--paper:#242026;--ink:#FEFAD9;--ink2:#CFC4A6;--line:#3A343D;--hdr:#1C191E;--on:#4A3F12;
 --bd:#FEFAD9;--sh:#000;--csh:#FEFAD9;--deep:#884AFE;
}
html,body{background:var(--hdr)}
body{font-family:var(--f-body);font-weight:700;font-size:17px;line-height:1.3}
.note,.tips,.how,#sheet p,#sheet li,.wcard p,.src,.stamp{font-family:var(--f-body);font-weight:700;text-transform:none}
.tips,.how{font-size:17px}
/* tipografia: caixa alta no estilo do cartaz */
h1,h2,h3,.hour,.big,.days .chip-btn b,.card h3,.card .time,.whead h3,#sheet h2,h2.sec,.hc .tp,.chip-btn,.st,.go,.btnp,.btns,.mini,.pill,.live,.irl,nav button,.lg,.plabel,.dry,#install,.tag,.badge{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.hour{font-size:20px;font-weight:900}
.big{font-size:42px;font-weight:900;line-height:1}

main{padding-top:18px}

.chips .chip-btn[data-stage]:not([data-stage="all"])::before{border:2px solid var(--bd)}
.chips .chip-btn[data-stage][aria-pressed="true"]::before{border-color:var(--dk)}

/* caixinha de atração, como na programação oficial */

function layoutLabels(){
  const box=document.querySelector('#mapbox'); if(!box)return;
  const el=S.pin&&box.querySelector('.plabel[data-pin="'+S.pin+'"]'); if(!el||el.classList.contains('dim'))return;
  const W=box.clientWidth,H=box.clientHeight,R=13,g=15;
  const P={};box.querySelectorAll('.pin').forEach(b=>{P[b.dataset.pin]={x:parseFloat(b.style.left)/100*W,y:parseFloat(b.style.top)/100*H}});
  const p=P[S.pin]; const w=el.offsetWidth,h=el.offsetHeight;
  const ov=(a,b)=>Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
  const others=Object.entries(P).filter(([k])=>+k!==S.pin).map(([k,q])=>({x:q.x-R,y:q.y-R,w:2*R,h:2*R}));
  const cands=[{x:p.x+g,y:p.y-h/2},{x:p.x-g-w,y:p.y-h/2},{x:p.x-w/2,y:p.y-g-h},{x:p.x-w/2,y:p.y+g},{x:p.x+g-4,y:p.y-g-h+4},{x:p.x+g-4,y:p.y+g-4},{x:p.x-g-w+4,y:p.y-g-h+4},{x:p.x-g-w+4,y:p.y+g-4}];
  let best=null;
  cands.forEach((c,i)=>{const r={x:c.x,y:c.y,w,h};let s=i*(i<4?0.5:30);
    others.forEach(q=>s+=ov(r,q)*4);
    if(r.x<2)s+=(2-r.x)*h*40; if(r.y<2)s+=(2-r.y)*w*40; if(r.x+w>W-2)s+=(r.x+w-W+2)*h*40; if(r.y+h>H-2)s+=(r.y+h-H+2)*w*40;
    if(!best||s<best.s)best={s,r};});
  el.style.left=Math.round(best.r.x)+'px';el.style.top=Math.round(best.r.y)+'px';
}
function layoutNames(){
  const box=document.querySelector('#mapbox'); if(!box||!S.fsNames||!S.mapFs)return;
  const W=box.clientWidth,H=box.clientHeight,R=15,pad=3, names=[...box.querySelectorAll('.pname')];
  const pos={};box.querySelectorAll('.pin').forEach(b=>{pos[b.dataset.pin]={x:parseFloat(b.style.left)/100*W,y:parseFloat(b.style.top)/100*H}});
  const pinBoxes=Object.entries(pos).map(([n,q])=>({n:+n,x:q.x-R,y:q.y-R,w:2*R,h:2*R}));
  const hit=(a,b)=>a.x<b.x+b.w+pad&&b.x<a.x+a.w+pad&&a.y<b.y+b.h+pad&&b.y<a.y+a.h+pad;
  const placed=[]; const prio=n=>({palco:0,srv:1,ban:1,beb:2,exp:2}[PINS.find(p=>p.n===n).cat]??3);
  names.forEach(e=>{e.style.visibility='hidden';e.style.display='block';});
  [...names].sort((a,b)=>prio(+a.dataset.pin)-prio(+b.dataset.pin)).forEach(e=>{
    const n=+e.dataset.pin,q=pos[n],w=e.offsetWidth,h=e.offsetHeight,g=R+2;
    const cands=[{x:q.x+g,y:q.y-h/2},{x:q.x-g-w,y:q.y-h/2},{x:q.x-w/2,y:q.y-g-h},{x:q.x-w/2,y:q.y+g}];
    let ok=null;
    for(const c of cands){const r={x:c.x,y:c.y,w,h};
      if(r.x<2||r.y<2||r.x+w>W-2||r.y+h>H-2)continue;
      if(pinBoxes.some(p=>p.n!==n&&hit(r,p)))continue;
      if(placed.some(p=>hit(r,p)))continue;
      ok=r;break;}
    if(ok){e.style.left=Math.round(ok.x)+'px';e.style.top=Math.round(ok.y)+'px';e.style.visibility='visible';placed.push(ok);}
    else e.style.display='none';
  });
}

const hnorm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');

function helpIdx(){ if(_hidx)return _hidx; _hidx=Object.keys(HELP).map(k=>{const d=document.createElement('div');d.innerHTML=HELP[k][2]();const txt=d.textContent.replace(/\s+/g,' ').trim();return{k,t:HELP[k][0],txt,n:hnorm(txt),nt:hnorm(HELP[k][0]),kw:hnorm(HKW[k]||'')};}); return _hidx; }
function helpSearch(q){
  const terms=hnorm(q).split(/\s+/).filter(Boolean); if(!terms.length)return null;
  const out=[];
  helpIdx().forEach(it=>{
    let sc=0,ok=true;
    terms.forEach(t=>{const a=it.nt.includes(t),b=it.kw.includes(t),c=it.n.includes(t); if(!(a||b||c))ok=false; sc+=(a?3:0)+(b?2:0)+(c?1:0);});
    if(!ok)return;
    let ix=it.n.indexOf(terms[0]), snip='';
    if(ix>=0){const a=Math.max(0,ix-28),b=Math.min(it.txt.length,ix+terms[0].length+60);snip=(a>0?'…':'')+esc(it.txt.slice(a,ix))+'<mark>'+esc(it.txt.slice(ix,ix+terms[0].length))+'</mark>'+esc(it.txt.slice(ix+terms[0].length,b))+(b<it.txt.length?'…':'');}
    else snip=esc(it.txt.slice(0,70))+'…';
    out.push({k:it.k,sc,snip});
  });
  return out.sort((x,y)=>y.sc-x.sc);
}

async function pushSync(){

  if(deferredInstall){try{deferredInstall.prompt();const r=await deferredInstall.userChoice;if(r&&r.outcome==='accepted')markInstalled();}catch(e){}deferredInstall=null;return;}
  const ua=navigator.userAgent, ios=/iphone|ipad|ipod/i.test(ua), inapp=/FBAN|FBAV|Instagram|WhatsApp|Line\/|; wv\)/i.test(ua);

const rotCode=()=>[...S.sel].filter(i=>byId[i]).concat([...S.maybe].filter(i=>byId[i]).map(i=>'m'+i)).join('.');
const rotLink=()=>APP_URL+'/?r='+rotCode();
let _short={code:'',url:''};
const curShort=()=>_short.url&&_short.code===rotCode()?_short.url:'';
async function shortRotUrl(){
  const code=rotCode(),c0=curShort(); if(c0)return c0;
  if(!PUSH_URL||!code)return rotLink();
  try{const ac=new AbortController(),to=setTimeout(()=>ac.abort(),4500);
    const r=await fetch(PUSH_URL+'/r',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code}),signal:ac.signal});clearTimeout(to);
    const j=await r.json();if(j&&j.id){_short={code,url:APP_URL+'/?s='+j.id};return _short.url;}}catch(e){}
  return rotLink();
}
const linkMsg=u=>'Esse roteiro foi feito no *Rock the App*. Toque para colocar no seu app:\n'+u;
async function loadShort(id){const r=await fetch(PUSH_URL+'/r/'+id);if(!r.ok)return null;const j=await r.json();return parseCode('?r='+j.code);}
function rotText(l){
  return '*Meu roteiro · Rock the Mountain 2026*\n\n'+[0,1,2].map(dayText).filter(Boolean).join('\n\n')+'\n\n'+linkMsg(l||curShort()||rotLink());
}
function parseCode(txt){
  const s=String(txt||''), m=s.match(/[?&]r=([0-9m.\-]+)/)||s.match(/^\s*([0-9m][0-9m.\-]{2,})\s*$/);
  if(!m)return null;
  const sel=[],maybe=[];
  m[1].split('.').forEach(p=>{const mb=p[0]==='m',id=mb?p.slice(1):p;if(byId[id]&&!sel.includes(id)&&!maybe.includes(id))(mb?maybe:sel).push(id);});
  return (sel.length||maybe.length)?{sel,maybe}:null;
}
function copyTo(text,btn,done){
  const ok=()=>{if(btn){const o=btn.innerHTML;btn.innerHTML=btn.classList.contains('ico')?IC.check:(done||'Copiado');setTimeout(()=>{btn.innerHTML=o},1800);}};
  const fb=()=>{sheetHtml('Copie manualmente','<p class="note">Seu aparelho não deixou copiar sozinho. Selecione o texto abaixo.</p><textarea id="ta" readonly>'+esc(text)+'</textarea>');setTimeout(()=>{const a=$('#ta');if(a){a.focus();a.select();}},50);};
  try{navigator.clipboard.writeText(text).then(ok,fb);}catch(e){fb();}
}
